<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Space Miner 4000</title>
<style>
  html,body{margin:0;height:100%;background:#050505;color:#f2f2f2;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
  *{box-sizing:border-box}
  #wrap{position:fixed;inset:0;display:grid;place-items:center;background:#050505}
  canvas{width:100vw;height:100vh;display:block;touch-action:none}
  #touch{position:fixed;inset:0;pointer-events:none}
  .pad{position:absolute;bottom:18px;display:flex;gap:10px;pointer-events:auto}
  .left{left:18px}.right{right:18px}
  button.ctrl{width:58px;height:58px;border-radius:50%;border:2px solid #ddd;background:#111a;color:#fff;font-size:23px;font-weight:700;backdrop-filter:blur(4px)}
  button.ctrl:active{background:#fff;color:#000}
  #action{width:76px;height:76px}
  @media (min-width:900px){#touch{opacity:.18}.pad{bottom:22px}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="pad left">
    <button class="ctrl" data-k="ArrowLeft">◀</button>
    <button class="ctrl" data-k="ArrowRight">▶</button>
  </div>
  <div class="pad right">
    <button class="ctrl" data-k="ArrowUp">▲</button>
    <button class="ctrl" id="action" data-k="Space">●</button>
  </div>
</div>
<script>
'use strict';

const VERSION='v0.6.2';
const c = document.getElementById('game');
const ctx = c.getContext('2d');

let audioCtx=null, lastThrustSound=0;
function initAudio(){
  if(!audioCtx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC) audioCtx=new AC();
  }
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
}
function beep(freq=440,dur=.08,type='square',vol=.05,slide=0){
  if(!audioCtx)return;
  const now=audioCtx.currentTime;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,now);
  if(slide) o.frequency.linearRampToValueAtTime(Math.max(30,freq+slide),now+dur);
  g.gain.setValueAtTime(vol,now);
  g.gain.exponentialRampToValueAtTime(.0001,now+dur);
  o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+dur);
}
function sfx(name){
  initAudio();
  if(!audioCtx)return;
  if(name==='shoot') beep(760,.055,'square',.035,-260);
  else if(name==='hit'){beep(105,.11,'sawtooth',.07,-55);setTimeout(()=>beep(70,.08,'square',.045,-20),35)}
  else if(name==='alien') beep(240,.07,'square',.025,120);
  else if(name==='gem'){beep(680,.06,'sine',.045,180);setTimeout(()=>beep(940,.07,'sine',.035,100),45)}
  else if(name==='fuel'){beep(180,.07,'sine',.045,120);setTimeout(()=>beep(300,.08,'sine',.035,100),50)}
  else if(name==='thrust') beep(state==='lander'?72:90,.07,'sawtooth',.018,-18);
}
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){
  W=innerWidth; H=innerHeight; DPR=Math.min(devicePixelRatio||1,2);
  c.width=W*DPR;c.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize); resize();

const keys={};
addEventListener('keydown',e=>{
  initAudio();
  if(state==='title'||state==='gameover'||state==='win'){
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
    resetRun();
    return;
  }
  keys[e.code]=true;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if(e.code==='Space') actionPressed=true;
});
addEventListener('keyup',e=>keys[e.code]=false);
let actionPressed=false;
document.querySelectorAll('[data-k]').forEach(b=>{
  const code=b.dataset.k;
  const on=e=>{e.preventDefault();initAudio();keys[code]=true;if(code==='Space')actionPressed=true};
  const off=e=>{e.preventDefault();keys[code]=false};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);
});

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const hit=(a,b)=>a.x<a.x+a.w && false;
function rectHit(a,b){return a.x < b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y}
function circleHit(a,b,r){const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy<r*r}
function line(x1,y1,x2,y2,w=2){ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function text(t,x,y,s=18,align='left'){ctx.font='700 '+s+'px Arial';ctx.textAlign=align;ctx.fillText(t,x,y)}
function mono(alpha=1){ctx.strokeStyle='rgba(245,245,245,'+alpha+')';ctx.fillStyle='rgba(245,245,245,'+alpha+')'}

const planets=[
 {name:'ASH MOON', tint:'#bfbfbf', gravity:.055, aliens:5, gems:4, fuel:4},
 {name:'BLUE DUST', tint:'#9bc7ff', gravity:.068, aliens:7, gems:5, fuel:4},
 {name:'GREEN ROCK', tint:'#a8ddb0', gravity:.078, aliens:9, gems:6, fuel:3},
 {name:'VIOLET IX', tint:'#d0b1ff', gravity:.088, aliens:11, gems:7, fuel:3},
 {name:'BIG RED', tint:'#ff5050', gravity:.105, aliens:14, gems:9, fuel:2}
];

let state='title',planetIndex=0,score=0,high=+(localStorage.SM4000_HI||0),gems=0,banked=0;
let ship={fuel:100,maxFuel:100,hull:3,laser:1,thrust:1,x:0,y:0,vx:0,vy:0,angle:0,av:0,grounded:false};
let stars=[],shootingStars=[],asteroids=[],planet={x:0,y:0,r:90}, bullets=[],aliens=[],drops=[],particles=[];
let cameraX=0, surfaceWidth=2400, landedX=0, msg='', msgT=0, stageTimer=0, deathReason='';
let debris=[], explosionTimer=0, explosionScene='';

function resetRun(){
  planetIndex=0;score=0;gems=0;banked=0;
  ship={fuel:100,maxFuel:100,hull:3,laser:1,thrust:1,x:W*.22,y:H*.5,vx:0,vy:0,angle:0,av:0,grounded:false};
  setupFlight();
}

function setupFlight(){
  state='flight'; stageTimer=0; bullets=[];aliens=[];drops=[];particles=[];
  ship.x=W*.18;ship.y=H*.5;ship.vx=0;ship.vy=0;ship.angle=0;
  const p=planets[planetIndex];
  planet={x:W+Math.max(350,W*.55),y:H*.5,r:70+planetIndex*14};
  stars=Array.from({length:120},()=>({x:rnd(0,W),y:rnd(0,H),s:rnd(.5,2.2)}));
  asteroids=Array.from({length:10+planetIndex*4},()=>{
    const r=rnd(13,30);
    return {
      x:rnd(W*.35,planet.x-120),y:rnd(55,H-55),r,
      vx:rnd(-1.4,-.35),vy:rnd(-.45,.45),
      rot:rnd(0,Math.PI*2),spin:rnd(-.035,.035),mass:r*r,
      shape:Array.from({length:9},()=>rnd(.72,1.18))
    };
  });
  msg='REACH '+p.name;msgT=160;
}

function setupLander(){
  state='lander';stageTimer=0;bullets=[];drops=[];particles=[];
  ship.x=W*.5;ship.y=78;
  ship.vx=rnd(-.18,.18);
  ship.vy=.03;
  ship.angle=rnd(-.06,.06);
  ship.av=0;
  landedX=W*.5;
  msg='LUNAR DESCENT — USE SHORT THRUST BURSTS';msgT=180;
}

function terrainY(x){
  const base=H*.78;
  return base + Math.sin(x*.012+planetIndex)*20 + Math.sin(x*.028)*10;
}
function padY(){return terrainY(W*.5)-8}
function surfaceTerrainY(worldX){
  const base=H*.78;
  return base + Math.sin(worldX*.012+planetIndex)*20 + Math.sin(worldX*.028)*10;
}

function setupSurface(){
  state='surface';stageTimer=0; bullets=[];aliens=[];drops=[];particles=[];
  cameraX=0;
  ship.x=150;ship.y=surfaceTerrainY(150)-32; ship.vx=0; ship.vy=0; ship.grounded=true;
  const p=planets[planetIndex];
  aliens=Array.from({length:p.aliens},(_,i)=>({x:400+i*(surfaceWidth-600)/Math.max(1,p.aliens-1)+rnd(-80,80),y:0,w:26,h:32,hp:1+Math.floor(planetIndex/2),dir:Math.random()<.5?-1:1,t:rnd(0,200)}));
  drops=[];
  for(let i=0;i<p.gems;i++) drops.push({type:'gem',x:rnd(320,surfaceWidth-180),y:0,taken:false});
  for(let i=0;i<p.fuel;i++) drops.push({type:'fuel',x:rnd(320,surfaceWidth-180),y:0,taken:false});
  drops.push({type:'ship',x:surfaceWidth-130,y:0,taken:false});
  msg='MINE • REFUEL • RETURN TO SHIP';msgT=180;
}

function setupUpgrade(){
  state='upgrade';stageTimer=0;ship.fuel=ship.maxFuel;
}

function completePlanet(){
  banked += gems; gems=0; score += 1000 + planetIndex*500;
  if(planetIndex===planets.length-1){state='win';saveHi();return}
  setupUpgrade();
}

function saveHi(){if(score>high){high=score;localStorage.SM4000_HI=high}}

function rotatePoint(x,y,a){
  const c=Math.cos(a), ss=Math.sin(a);
  return {x:x*c-y*ss,y:x*ss+y*c};
}

function spawnShipExplosion(x,y,angle=0){
  const pieces=[
    [0,-18,12,8],[12,8,9,10],[9,10,10,16],[10,16,3,12],
    [3,12,0,15],[0,15,-3,12],[-3,12,-10,16],[-10,16,-9,10],
    [-9,10,-12,8],[-12,8,0,-18],
    [-6,11,-12,22],[-12,22,-16,24],
    [6,11,12,22],[12,22,16,24],[-7,12,7,12]
  ];
  debris=pieces.map(p=>{
    const mx=(p[0]+p[2])/2,my=(p[1]+p[3])/2;
    const rp=rotatePoint(mx,my,angle);
    return {
      x1:p[0]-mx,y1:p[1]-my,x2:p[2]-mx,y2:p[3]-my,
      x:x+rp.x,y:y+rp.y,angle:angle+rnd(-.5,.5),
      vx:rnd(-3.2,3.2)+rp.x*.03,vy:rnd(-4.2,-.8)+rp.y*.03,
      va:rnd(-.22,.22),life:70+rnd(0,25)
    };
  });
  burst(x,y,34);
  sfx('hit');
}

function startShipExplosion(reason){
  deathReason=reason||'MISSION LOST';
  saveHi();
  explosionScene=state;
  spawnShipExplosion(ship.x,ship.y,ship.angle||0);
  explosionTimer=90;
  msg=deathReason;msgT=90;
  state='exploding';
}

function lose(reason,shipBoom=false){
  if(shipBoom && (state==='flight'||state==='lander')){
    startShipExplosion(reason);
    return;
  }
  deathReason=reason||'MISSION LOST';
  saveHi();state='gameover';msg=deathReason;
}

function burst(x,y,n=12){
  for(let i=0;i<n;i++) particles.push({x,y,vx:rnd(-2.2,2.2),vy:rnd(-2.2,2.2),life:rnd(20,55)});
}

function splitAsteroid(a, impactVX=0, impactVY=0){
  if(a.r<15){a.dead=true;burst(a.x,a.y,10);return}
  a.dead=true;
  const nr=a.r*.58;
  for(let i=0;i<2;i++){
    const ang=(i?1:-1)*rnd(.55,1.1);
    const speed=rnd(1.0,2.0);
    asteroids.push({
      x:a.x+Math.cos(ang)*nr,y:a.y+Math.sin(ang)*nr,r:nr,
      vx:a.vx+Math.cos(ang)*speed+impactVX*.15,
      vy:a.vy+Math.sin(ang)*speed+impactVY*.15,
      rot:rnd(0,Math.PI*2),spin:rnd(-.06,.06),mass:nr*nr,
      shape:Array.from({length:8},()=>rnd(.72,1.18))
    });
  }
  burst(a.x,a.y,16);
}

function updateFlight(){
  stageTimer++;
  const thrust=.105*ship.thrust;
  const turn=.045;
  if(keys.ArrowLeft) ship.angle-=turn;
  if(keys.ArrowRight) ship.angle+=turn;
  if(keys.ArrowUp){
    ship.vx+=Math.sin(ship.angle)*thrust;
    ship.vy-=Math.cos(ship.angle)*thrust;
    ship.fuel-=.04;
    const now=performance.now();
    if(now-lastThrustSound>115){sfx('thrust');lastThrustSound=now}
  }
  if(actionPressed && bullets.filter(b=>b.mode==='space').length<5){
    sfx('shoot');
    bullets.push({
      mode:'space',x:ship.x+Math.sin(ship.angle)*20,y:ship.y-Math.cos(ship.angle)*20,
      vx:ship.vx+Math.sin(ship.angle)*7.5,vy:ship.vy-Math.cos(ship.angle)*7.5,life:75
    });
  }
  actionPressed=false;

  ship.vx*=.994;ship.vy*=.994;
  ship.x+=ship.vx;ship.y+=ship.vy;
  ship.y=clamp(ship.y,25,H-25);ship.x=clamp(ship.x,20,W*.72);
  planet.x-=1.6+planetIndex*.25;

  for(const b of bullets){
    if(b.mode!=='space')continue;
    b.x+=b.vx;b.y+=b.vy;b.life--;
  }
  bullets=bullets.filter(b=>b.mode!=='space'||(b.life>0&&b.x>-50&&b.x<W+100&&b.y>-50&&b.y<H+50));

  asteroids.forEach(a=>{a.x+=a.vx-1.25;a.y+=a.vy;a.rot+=a.spin});

  // Asteroid-to-asteroid elastic collisions.
  for(let i=0;i<asteroids.length;i++){
    const a=asteroids[i]; if(a.dead)continue;
    for(let j=i+1;j<asteroids.length;j++){
      const b=asteroids[j]; if(b.dead)continue;
      const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy),min=a.r+b.r;
      if(dist>0&&dist<min){
        const nx=dx/dist,ny=dy/dist;
        const overlap=min-dist;
        a.x-=nx*overlap*.5;a.y-=ny*overlap*.5;b.x+=nx*overlap*.5;b.y+=ny*overlap*.5;
        const rvx=b.vx-a.vx,rvy=b.vy-a.vy,along=rvx*nx+rvy*ny;
        if(along<0){
          const impulse=-(1.75)*along/(1/a.mass+1/b.mass);
          const ix=impulse*nx,iy=impulse*ny;
          a.vx-=ix/a.mass;a.vy-=iy/a.mass;b.vx+=ix/b.mass;b.vy+=iy/b.mass;
          a.spin+=rnd(-.01,.01);b.spin+=rnd(-.01,.01);
          if(Math.abs(along)>2.25 && (a.r>18||b.r>18)){
            (a.r>b.r?splitAsteroid(a,rvx,rvy):splitAsteroid(b,-rvx,-rvy));
          }
        }
      }
    }
  }

  // Laser shots can break larger asteroids.
  for(const b of bullets){
    if(b.mode!=='space'||b.life<=0)continue;
    for(const a of asteroids){
      if(a.dead)continue;
      if(Math.hypot(b.x-a.x,b.y-a.y)<a.r+3){
        b.life=0;score+=50;sfx('hit');
        splitAsteroid(a,b.vx,b.vy);
        break;
      }
    }
  }

  for(const a of asteroids){
    if(a.dead)continue;
    if(Math.hypot(ship.x-a.x,ship.y-a.y)<a.r+13){
      const dx=ship.x-a.x,dy=ship.y-a.y,d=Math.hypot(dx,dy)||1;
      ship.vx+=(dx/d)*2.2;ship.vy+=(dy/d)*2.2;
      splitAsteroid(a,ship.vx,ship.vy);
      sfx('hit');burst(ship.x,ship.y,20);ship.hull--;score=Math.max(0,score-150);
      if(ship.hull<=0) lose('HULL DESTROYED — ASTEROID IMPACT',true);
      else {msg='ASTEROID HIT — HULL '+ship.hull;msgT=80}
    }
  }
  asteroids=asteroids.filter(a=>!a.dead && a.x>-120 && a.y>-100 && a.y<H+100);
  if(ship.fuel<=0) lose('OUT OF FUEL');
  if(planet.x-planet.r < W*.52) setupLander();
}

function updateLander(){
  // Intentionally floaty, 1980s Lunar Lander-style physics.
  const g=.0048 + planetIndex*.00065;
  ship.vy+=g;

  const torque=.00145;
  if(keys.ArrowLeft) ship.av-=torque;
  if(keys.ArrowRight) ship.av+=torque;
  ship.av*=.992;
  ship.angle+=ship.av;

  if(keys.ArrowUp){
    const power=.0145*ship.thrust;
    ship.vx+=Math.sin(ship.angle)*power;
    ship.vy-=Math.cos(ship.angle)*power;
    ship.fuel-=.028;
    const now=performance.now();
    if(now-lastThrustSound>125){sfx('thrust');lastThrustSound=now}
  }

  ship.vx*=.9995;
  ship.vy*=.9998;
  ship.x+=ship.vx;
  ship.y+=ship.vy;
  ship.x=clamp(ship.x,22,W-22);

  const onPad=Math.abs(ship.x-W*.5)<78;
  const groundY=onPad?padY():terrainY(ship.x);

  if(ship.y+22>=groundY){
    const vertical=Math.abs(ship.vy);
    const horizontal=Math.abs(ship.vx);
    const upright=Math.abs(Math.atan2(Math.sin(ship.angle),Math.cos(ship.angle)));

    if(onPad && vertical<.72 && horizontal<.50 && upright<.24){
      score+=500;
      burst(ship.x,groundY,18);
      ship.angle=0;ship.av=0;
      setupSurface();
    } else if(!onPad) {
      lose('BAD LANDING — CRASHED ON ROUGH GROUND',true);
    } else if(vertical>=.72) {
      lose('BAD LANDING — DESCENT TOO FAST',true);
    } else if(horizontal>=.50) {
      lose('BAD LANDING — TOO MUCH SIDEWAYS SPEED',true);
    } else {
      lose('BAD LANDING — SHIP NOT LEVEL',true);
    }
  }

  if(ship.fuel<=0) lose('OUT OF FUEL DURING LANDING');
}

function updateSurface(){
  stageTimer++;
  const speed=2.4+ship.thrust*.2;
  const move=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);
  ship.vx += move*.34;
  ship.vx *= ship.grounded?.72:.94;
  ship.vx=clamp(ship.vx,-speed,speed);

  // UP jumps; SPACE / action still fires.
  if(keys.ArrowUp && ship.grounded){
    ship.vy=-5.8-planetIndex*.08;
    ship.grounded=false;
  }
  ship.vy+=.23+planetIndex*.012;
  ship.x=clamp(ship.x+ship.vx,30,surfaceWidth-30);
  ship.y+=ship.vy;

  const ground=surfaceTerrainY(ship.x)-32;
  if(ship.y>=ground){
    ship.y=ground;ship.vy=0;ship.grounded=true;
  } else ship.grounded=false;

  cameraX=clamp(ship.x-W*.35,0,Math.max(0,surfaceWidth-W));

  if(actionPressed && bullets.filter(b=>!b.enemy&&b.mode!=='space').length<4+ship.laser){
    const dir=move<0?-1:1;
    sfx('shoot');
    bullets.push({mode:'surface',x:ship.x+dir*16,y:ship.y-5,vx:dir*(7+ship.laser*.8),vy:0,life:70});
  }
  actionPressed=false;
  bullets.forEach(b=>{if(b.mode!=='space'){b.x+=b.vx;b.y+=(b.vy||0);b.life--}});
  bullets=bullets.filter(b=>b.mode==='space'||(b.life>0&&b.x>cameraX-30&&b.x<cameraX+W+30));

  aliens.forEach(a=>{
    a.t++; a.y=surfaceTerrainY(a.x)-30;
    if(Math.abs(a.x-ship.x)<230) a.dir=a.x<ship.x?1:-1;
    a.x+=a.dir*(.45+planetIndex*.08);
    if(a.t%(120-planetIndex*10|0)===0 && Math.abs(a.x-ship.x)<420){
      sfx('alien');
      bullets.push({mode:'surface',enemy:true,x:a.x,y:a.y-8,vx:(ship.x<a.x?-1:1)*(2.4+planetIndex*.3),vy:0,life:180});
    }
  });

  for(const b of bullets){
    if(b.mode==='space')continue;
    if(b.enemy){
      if(Math.abs(b.x-ship.x)<16 && Math.abs(b.y-ship.y)<24){
        b.life=0;ship.hull--;sfx('hit');burst(ship.x-cameraX,ship.y,15);
        if(ship.hull<=0)lose('SUIT BREACHED — ALIEN FIRE');
        else {msg='ALIEN HIT — HULL '+ship.hull;msgT=65}
      }
    }else{
      for(const a of aliens){
        if(a.hp>0 && Math.abs(b.x-a.x)<18 && Math.abs(b.y-a.y)<22){
          a.hp-=ship.laser;b.life=0;score+=100;sfx('hit');
          if(a.hp<=0){burst(a.x-cameraX,a.y,12);score+=150}
        }
      }
    }
  }
  aliens=aliens.filter(a=>a.hp>0);

  for(const d of drops){
    if(d.taken||d.type==='ship')continue;
    d.y=surfaceTerrainY(d.x)-18;
    if(Math.abs(d.x-ship.x)<24 && Math.abs(d.y-ship.y)<34){
      d.taken=true;
      if(d.type==='gem'){gems++;score+=200;sfx('gem');msg='+ GEM';msgT=45}
      if(d.type==='fuel'){ship.fuel=Math.min(ship.maxFuel,ship.fuel+22);score+=80;sfx('fuel');msg='+ FUEL';msgT=45}
    }
  }
  const exit=drops.find(d=>d.type==='ship');
  if(exit){
    exit.y=surfaceTerrainY(exit.x)-34;
    if(Math.abs(exit.x-ship.x)<42 && ship.grounded){
      if(aliens.length===0 || gems>=2){completePlanet();}
      else {msg='CLEAR MORE ALIENS / FIND GEMS';msgT=80}
    }
  }
  ship.fuel-=.0035;
  if(ship.fuel<=0) lose('OUT OF FUEL');
}

function buy(type){
  if(type==='fuel' && banked>=2){banked-=2;ship.maxFuel+=20;ship.fuel=ship.maxFuel;score+=100}
  if(type==='laser' && banked>=3){banked-=3;ship.laser=Math.min(4,ship.laser+1);score+=150}
  if(type==='thrust' && banked>=3){banked-=3;ship.thrust=Math.min(3,ship.thrust+.35);score+=150}
  if(type==='hull' && banked>=2 && ship.hull<5){banked-=2;ship.hull=Math.min(5,ship.hull+1);score+=100}
}

c.addEventListener('pointerdown',e=>{
  initAudio();
  const x=e.clientX,y=e.clientY;
  if(state==='title'){resetRun();return}
  if(state==='gameover'||state==='win'){resetRun();return}
  if(state==='upgrade'){
    const bw=Math.min(330,W*.78), bx=(W-bw)/2;
    const rows=[
      {y:H*.43,type:'fuel',cost:2},
      {y:H*.53,type:'laser',cost:3},
      {y:H*.63,type:'thrust',cost:3},
      {y:H*.73,type:'hull',cost:2}
    ];
    for(const r of rows) if(x>bx&&x<bx+bw&&y>r.y-28&&y<r.y+28) buy(r.type);
    if(y>H*.84){planetIndex++;setupFlight()}
  }
});

function drawShip(x,y,s=1,angle=0,thrusting=false,leftJet=false,rightJet=false){
  ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(s,s);mono();
  ctx.lineWidth=2;

  // Fun retro lunar lander body.
  ctx.beginPath();
  ctx.moveTo(0,-18);
  ctx.lineTo(11,-8);
  ctx.lineTo(13,6);
  ctx.lineTo(8,12);
  ctx.lineTo(-8,12);
  ctx.lineTo(-13,6);
  ctx.lineTo(-11,-8);
  ctx.closePath();
  ctx.stroke();

  // Cockpit dome and little antenna.
  ctx.beginPath();ctx.arc(0,-6,5,Math.PI,0);ctx.stroke();
  line(0,-18,0,-24,1.5);
  ctx.beginPath();ctx.arc(0,-25,1.5,0,Math.PI*2);ctx.stroke();

  // Engine bell.
  line(-5,12,-3,17,2);line(5,12,3,17,2);line(-3,17,3,17,2);

  // Long lunar-lander legs.
  line(-8,10,-15,22,2);
  line(8,10,15,22,2);
  line(-15,22,-21,24,2);
  line(15,22,21,24,2);
  line(-10,13,-15,22,1);
  line(10,13,15,22,1);

  if(thrusting){
    ctx.beginPath();
    ctx.moveTo(-3,18);
    ctx.lineTo(0,31+rnd(2,10));
    ctx.lineTo(3,18);
    ctx.stroke();
    ctx.globalAlpha=.35;
    ctx.beginPath();
    ctx.moveTo(-1.5,18);
    ctx.lineTo(0,39+rnd(0,7));
    ctx.lineTo(1.5,18);
    ctx.stroke();
    ctx.globalAlpha=1;
  }
  if(leftJet){ctx.beginPath();ctx.moveTo(11,-4);ctx.lineTo(19,-1+rnd(-2,2));ctx.lineTo(12,3);ctx.stroke()}
  if(rightJet){ctx.beginPath();ctx.moveTo(-11,-4);ctx.lineTo(-19,-1+rnd(-2,2));ctx.lineTo(-12,3);ctx.stroke()}
  ctx.restore();
}

function updateExplosion(){
  explosionTimer--;
  debris.forEach(d=>{
    d.x+=d.vx;d.y+=d.vy;
    d.vy+=explosionScene==='lander'?.055:.018;
    d.angle+=d.va;d.life--;
  });
  debris=debris.filter(d=>d.life>0);
  if(explosionTimer<=0) state='gameover';
}

function drawDebris(){
  debris.forEach(d=>{
    ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.angle);
    mono(Math.max(.15,d.life/95));ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(d.x1,d.y1);ctx.lineTo(d.x2,d.y2);ctx.stroke();
    ctx.restore();
  });
}

function drawExplosion(){
  ctx.fillStyle='#050505';ctx.fillRect(0,0,W,H);
  if(explosionScene==='flight'){
    stars.forEach(st=>{ctx.globalAlpha=.25+st.s*.15;ctx.fillStyle='#fff';ctx.fillRect(st.x,st.y,st.s,st.s)});
    ctx.globalAlpha=1;
    const p=planets[planetIndex];
    ctx.strokeStyle=p.tint;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(planet.x,planet.y,planet.r,0,Math.PI*2);ctx.stroke();
  } else if(explosionScene==='lander'){
    const p=planets[planetIndex];ctx.strokeStyle=p.tint;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,terrainY(0));for(let x=0;x<=W;x+=12)ctx.lineTo(x,terrainY(x));ctx.stroke();
    mono();ctx.fillRect(W*.5-62,padY(),124,7);
  }
  drawDebris();
  particles.forEach(pt=>{mono(pt.life/55);ctx.fillRect(pt.x,pt.y,2,2)});
  drawHUD();
  ctx.fillStyle='#ff6b6b';text(deathReason,W/2,H*.2,18,'center');mono();
}

function drawAstronaut(x,y){
  ctx.save();ctx.translate(x,y);mono();ctx.lineWidth=2;
  ctx.strokeRect(-7,-15,14,18);ctx.beginPath();ctx.arc(0,-21,8,0,Math.PI*2);ctx.stroke();
  line(-6,3,-9,14);line(6,3,9,14);line(-7,-8,-13,-1);line(7,-8,13,-1);
  ctx.restore();
}

function drawAlien(x,y){
  ctx.save();ctx.translate(x,y);mono();ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,-12,9,Math.PI,0);ctx.lineTo(9,2);ctx.lineTo(-9,2);ctx.closePath();ctx.stroke();
  ctx.fillRect(-4,-12,2,2);ctx.fillRect(2,-12,2,2);line(-7,2,-11,12);line(7,2,11,12);line(-4,2,-5,13);line(4,2,5,13);
  ctx.restore();
}

function drawHUD(){
  mono(.95);ctx.globalAlpha=1;
  ctx.fillStyle='#090909aa';ctx.fillRect(10,10,Math.min(560,W-20),54);
  mono();text('SPACE MINER 4000 '+VERSION,22,32,15);
  text('SCORE '+score,22,53,15);
  text('FUEL '+Math.max(0,ship.fuel|0)+'/'+ship.maxFuel,170,53,15);
  text('GEMS '+(gems+banked),330,53,15);
  text('HULL '+ship.hull,440,53,15);
}

function drawFlight(){
  ctx.fillStyle='#050505';ctx.fillRect(0,0,W,H);mono(.7);
  stars.forEach(s=>{ctx.globalAlpha=.35+s.s*.2;ctx.fillRect((s.x-stageTimer*s.s*.08+W)%W,s.y,s.s,s.s)});ctx.globalAlpha=1;
  asteroids.forEach(a=>{
    ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.rot);mono(.72);ctx.lineWidth=2;
    ctx.beginPath();
    a.shape.forEach((m,i)=>{const ang=i/a.shape.length*Math.PI*2, rr=a.r*m, x=Math.cos(ang)*rr, y=Math.sin(ang)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
    ctx.closePath();ctx.stroke();
    ctx.globalAlpha=.45;ctx.beginPath();ctx.arc(-a.r*.2,-a.r*.1,a.r*.22,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(a.r*.28,a.r*.18,a.r*.12,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;ctx.restore();
  });
  bullets.filter(b=>b.mode==='space').forEach(b=>{
    mono();ctx.fillRect(b.x-4,b.y-1,9,2);
  });
  const p=planets[planetIndex];
  const approach=Math.max(0,1-(planet.x-W*.52)/(W*.9));
  const pr=planet.r*(1+approach*1.35);
  ctx.strokeStyle=p.tint;ctx.fillStyle='#080808';ctx.lineWidth=3;ctx.beginPath();ctx.arc(planet.x,planet.y,pr,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.globalAlpha=.35;ctx.strokeStyle=p.tint;ctx.beginPath();ctx.arc(planet.x-pr*.2,planet.y-pr*.1,pr*.28,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
  drawShip(ship.x,ship.y,1,ship.angle,keys.ArrowUp);
  drawHUD();
  mono();text('FLY',W/2,96,18,'center');text(p.name,W/2,122,13,'center');
}

function drawLander(){
  ctx.fillStyle='#060606';ctx.fillRect(0,0,W,H);
  const p=planets[planetIndex];ctx.strokeStyle=p.tint;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,terrainY(0));for(let x=0;x<=W;x+=12)ctx.lineTo(x,terrainY(x));ctx.stroke();
  ctx.fillStyle='#0c0c0c';ctx.fillRect(0,terrainY(W*.5),W,H);
  mono();ctx.fillRect(W*.5-62,padY(),124,7);line(W*.5-55,padY()+7,W*.5-45,padY()+18);line(W*.5+55,padY()+7,W*.5+45,padY()+18);
  drawShip(ship.x,ship.y,1.1,ship.angle,keys.ArrowUp,keys.ArrowLeft,keys.ArrowRight);
  drawHUD();mono();text('LANDER',W/2,96,18,'center');
  text('V '+ship.vy.toFixed(2)+'   H '+Math.abs(ship.vx).toFixed(2)+'   ANG '+Math.round(Math.abs(ship.angle)*180/Math.PI)+'°',W/2,122,13,'center');
  text('SAFE: V < 0.72   H < 0.50   ANG < 14°',W/2,145,12,'center');
}

function drawSurface(){
  ctx.fillStyle='#060606';ctx.fillRect(0,0,W,H);
  const p=planets[planetIndex];
  ctx.strokeStyle=p.tint;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,surfaceTerrainY(cameraX));for(let x=0;x<=W;x+=12)ctx.lineTo(x,surfaceTerrainY(cameraX+x));ctx.stroke();
  ctx.fillStyle='#0b0b0b';ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
  for(let i=0;i<10;i++){const x=(i*260-cameraX*.35)%(W+260)-100;mono(.22);ctx.beginPath();ctx.arc(x,H*.54,50+(i%3)*18,Math.PI,0);ctx.stroke()}
  drops.forEach(d=>{
    if(d.taken)return;
    const x=d.x-cameraX;d.y=surfaceTerrainY(d.x)-(d.type==='ship'?34:18);
    if(d.type==='gem'){ctx.strokeStyle=p.tint;ctx.beginPath();ctx.moveTo(x,d.y-10);ctx.lineTo(x+8,d.y);ctx.lineTo(x,d.y+10);ctx.lineTo(x-8,d.y);ctx.closePath();ctx.stroke()}
    if(d.type==='fuel'){mono();ctx.strokeRect(x-8,d.y-10,16,20);text('F',x,d.y+5,11,'center')}
    if(d.type==='ship')drawShip(x,d.y,1.6,0,false);
  });
  aliens.forEach(a=>drawAlien(a.x-cameraX,a.y));
  bullets.forEach(b=>{mono();ctx.fillRect(b.x-cameraX,b.y,b.enemy?5:9,2)});
  drawAstronaut(ship.x-cameraX,ship.y);
  particles.forEach(pt=>{mono(pt.life/55);ctx.fillRect(pt.x,pt.y,2,2)});
  drawHUD();mono();text('PLANET '+(planetIndex+1)+' / '+planets.length+' — '+p.name,W/2,96,15,'center');
}

function drawUpgrade(){
  ctx.fillStyle='#050505';ctx.fillRect(0,0,W,H);mono();

  text('SHIP UPGRADE',W/2,H*.12,32,'center');
  text('BANKED GEMS: '+banked,W/2,H*.175,18,'center');

  // Ship status panel.
  const maxHull=5;
  const damage=Math.max(0,maxHull-ship.hull);
  const shipY=H*.27;
  drawShip(W*.28,shipY,2.2,0,false);

  text('SHIP STATUS',W*.46,H*.225,16);
  text('HULL '+ship.hull+' / '+maxHull,W*.46,H*.255,18);
  text(damage===0?'NO DAMAGE':damage+' HULL DAMAGE TO REPAIR',W*.46,H*.285,14);

  // Hull condition bar.
  const barX=W*.46, barY=H*.305, barW=Math.min(230,W*.42), barH=12;
  ctx.strokeStyle='#eee';ctx.strokeRect(barX,barY,barW,barH);
  ctx.fillStyle='#eee';ctx.fillRect(barX+2,barY+2,(barW-4)*(ship.hull/maxHull),barH-4);

  const bw=Math.min(360,W*.82),bx=(W-bw)/2;
  const rows=[
    ['FUEL TANK +20','2 GEMS',H*.43],
    ['LASER POWER +1','3 GEMS',H*.53],
    ['THRUST +','3 GEMS',H*.63],
    ['REPAIR HULL +1',damage>0?'2 GEMS • '+damage+' DAMAGED':'FULL HULL',H*.73]
  ];
  rows.forEach((r,i)=>{
    ctx.strokeStyle='#eee';ctx.strokeRect(bx,r[2]-27,bw,54);
    text(r[0],bx+16,r[2]+5,16);
    text(r[1],bx+bw-16,r[2]+5,14,'right');
    if(i===3 && damage===0){
      ctx.globalAlpha=.35;
      ctx.fillStyle='#eee';
      ctx.fillRect(bx,r[2]-27,bw,54);
      ctx.globalAlpha=1;
      ctx.fillStyle='#050505';
      text('FULL HULL',bx+bw/2,r[2]+5,14,'center');
      mono();
    }
  });

  text('TAP BELOW TO LAUNCH TO '+planets[planetIndex+1].name,W/2,H*.88,16,'center');
  line(W*.3,H*.91,W*.7,H*.91,2);
  ctx.globalAlpha=.65;text(VERSION,W-18,H-18,12,'right');ctx.globalAlpha=1;
}

function drawTitle(){
  ctx.fillStyle='#050505';ctx.fillRect(0,0,W,H);mono();
  for(let i=0;i<80;i++){const x=(i*97)%W,y=(i*53)%H;ctx.globalAlpha=.15+(i%5)*.08;ctx.fillRect(x,y,1+(i%2),1+(i%2))}ctx.globalAlpha=1;
  if(Math.random()<.018 && shootingStars.length<3){
    shootingStars.push({x:rnd(W*.1,W*.75),y:rnd(20,H*.42),vx:rnd(8,13),vy:rnd(2.5,5),life:rnd(24,40)});
  }
  shootingStars.forEach(st=>{st.x+=st.vx;st.y+=st.vy;st.life--;ctx.globalAlpha=Math.min(1,st.life/10);mono();line(st.x,st.y,st.x-st.vx*4,st.y-st.vy*4,1.5)});
  shootingStars=shootingStars.filter(st=>st.life>0&&st.x<W+80);ctx.globalAlpha=1;
  text('SPACE',W/2,H*.28,Math.min(70,W*.15),'center');
  text('MINER 4000',W/2,H*.40,Math.min(70,W*.15),'center');
  ctx.strokeStyle='#ff5050';line(W*.23,H*.44,W*.77,H*.44,3);
  text('FLY • LAND • MINE • UPGRADE',W/2,H*.52,17,'center');
  text('FLIGHT: LEFT / RIGHT ROTATE • UP THRUST',W/2,H*.59,14,'center');
  text('SURFACE: LEFT / RIGHT MOVE • UP JUMP',W/2,H*.63,14,'center');
  text('SPACE / ● TO FIRE',W/2,H*.67,14,'center');
  text('PRESS ANY KEY OR TAP TO LAUNCH',W/2,H*.75,21,'center');
  text('HIGH SCORE '+high,W/2,H*.82,13,'center');
  ctx.globalAlpha=.65;text(VERSION,W-18,H-18,12,'right');ctx.globalAlpha=1;
}

function drawEnd(win){
  ctx.fillStyle='#050505';ctx.fillRect(0,0,W,H);mono();
  text(win?'BIG RED CONQUERED':'MISSION LOST',W/2,H*.32,34,'center');
  if(!win){ctx.fillStyle='#ff6b6b';text(deathReason,W/2,H*.405,18,'center');mono();}
  text('SCORE '+score,W/2,H*.49,26,'center');
  text('HIGH SCORE '+Math.max(high,score),W/2,H*.54,18,'center');
  text(win?'SPACE MINER STATUS: LEGEND':'PRESS ANY KEY OR TAP TO TRY AGAIN',W/2,H*.68,18,'center');
  if(win) text('TAP TO PLAY AGAIN',W/2,H*.75,16,'center');
  ctx.globalAlpha=.65;text(VERSION,W-18,H-18,12,'right');ctx.globalAlpha=1;
}

function drawMessage(){
  if(msgT<=0)return;msgT--;ctx.globalAlpha=Math.min(1,msgT/20);ctx.fillStyle='#000c';ctx.fillRect(W*.2,H*.15,W*.6,44);mono();text(msg,W/2,H*.15+29,15,'center');ctx.globalAlpha=1;
}

let last=0;
function loop(t){
  const dt=Math.min(2,(t-last)/16.67||1);last=t;
  if(state==='flight')updateFlight();
  else if(state==='lander')updateLander();
  else if(state==='surface')updateSurface();
  else if(state==='exploding')updateExplosion();

  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.98;p.vy*=.98;p.life--});particles=particles.filter(p=>p.life>0);

  if(state==='title')drawTitle();
  else if(state==='flight')drawFlight();
  else if(state==='lander')drawLander();
  else if(state==='surface')drawSurface();
  else if(state==='upgrade')drawUpgrade();
  else if(state==='exploding')drawExplosion();
  else if(state==='gameover')drawEnd(false);
  else if(state==='win')drawEnd(true);
  if(!['title','gameover','win','upgrade','exploding'].includes(state))drawMessage();
  actionPressed=false;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
